<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車買取査定 事前ヒアリング</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f5f7f8;
    margin: 0;
    padding: 16px;
    color: #1a2b2f;
  }
  h1 {
    font-size: 18px;
    margin: 8px 0 20px;
  }
  form {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 14px 0 4px;
    color: #2a4a4f;
  }
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #d5dee0;
    border-radius: 8px;
    font-size: 15px;
  }
  /* iPhoneで日付欄が枠からはみ出すのを防ぐ */
  input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    min-width: 0;
    max-width: 100%;
    min-height: 44px;
    background: #fff;
    color: #1a2b2f;
  }
  input[type="date"]::-webkit-date-and-time-value {
    text-align: left;
  }
  .consent {
    margin-top: 24px;
    padding: 14px;
    background: #f5f7f8;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
  }
  .consent p {
    margin: 0 0 10px;
  }
  .consent label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 14px;
  }
  .consent input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: #0f8a8a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
  }
  button:disabled { background: #a9c8c8; }
  #status {
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <h1>車買取査定 事前ヒアリング</h1>
  <form id="hearingForm">
    <label>氏名</label>
    <input type="text" name="name" required>

    <label>生年月日</label>
    <input type="date" name="birthday" required>

    <label>住所</label>
    <input type="text" name="address" required>

    <label>電話番号</label>
    <input type="tel" name="phone" required>

    <label>お乗りの車種</label>
    <input type="text" name="carModel" required>

    <label>年式</label>
    <input type="text" name="carYear" placeholder="例: 2018年式" required>

    <label>走行距離</label>
    <input type="text" name="mileage" placeholder="例: 45000km" required>

    <label>次に乗る車種(任意)</label>
    <input type="text" name="nextCarModel">

    <label>新車 or 中古車(任意)</label>
    <select name="newOrUsed">
      <option value="">選択してください</option>
      <option value="新車">新車</option>
      <option value="中古車">中古車</option>
    </select>

    <label>グレード(任意)</label>
    <input type="text" name="grade">

    <label>色(任意)</label>
    <input type="text" name="color">

    <label>取引日(任意)</label>
    <input type="date" name="dealDate">

    <label>次に乗るお車の車検満了日(任意)</label>
    <input type="date" name="shakenDate">

    <div class="consent">
      <p><strong>個人情報の取り扱いについて</strong><br>
      ご入力いただいた情報は、ハッピーカーズ府中店にて、査定・お取引に関するご連絡のほか、お誕生日や車検時期などのご案内（LINEでのお知らせ）に利用します。ご案内が不要な場合は、いつでもLINEでお申し付けください。</p>
      <label><input type="checkbox" name="consent" value="同意" required>上記に同意する</label>
    </div>

    <button type="submit" id="submitBtn">送信する</button>
    <div id="status"></div>
  </form>

<script>
  // ここに手順4で取得するLIFF IDを設定します
  const LIFF_ID = "2012119794-IcSnggu0";
  // ここに手順3で取得するGASのWebアプリURLを設定します
  const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwe2QJpRUOp5butufzMC-AMTjo6A0Kp6ko9ek4x5sMI9TzE4PVUtDGqf7IXavNPb164QA/exec";

  let lineUserId = "";

  async function init() {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    const profile = await liff.getProfile();
    lineUserId = profile.userId;
  }
  init();

  document.getElementById("hearingForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const status = document.getElementById("status");
    btn.disabled = true;
    status.textContent = "送信中…";

    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    data.lineUserId = lineUserId;

    try {
      await fetch(GAS_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(data)
      });
      status.textContent = "送信が完了しました。ありがとうございました。";
      setTimeout(() => liff.closeWindow(), 1500);
    } catch (err) {
      status.textContent = "送信に失敗しました。時間をおいて再度お試しください。";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
